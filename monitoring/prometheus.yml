global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: civil-code-rag
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
  - job_name: pushgateway          # scripts/evaluation/monitor_drift.py and run_evaluation.py push here
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
