# Prometheus WITHOUT Docker (Windows binary): scrapes the API running on this machine.
#   prometheus.exe --config.file=monitoring\local\prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - ../alerts.yml
scrape_configs:
  - job_name: civil-code-rag
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8000"]
