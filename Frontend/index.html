<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد القانون المدني المصري</title>
<style>
:root{--bg:#f3f5f9;--cd:#fff;--tx:#16202f;--mu:#5b6678;--ln:#e0e5ed;--sb:#10213f;--sbt:#e4eaf5;--sbm:#9fb0cc;--pr:#14284b;--prt:#fff;--br:#8c5e12;--brs:#f7eddb;--bra:#c8963e;--ok:#13734a;--okb:#e5f4ec;--wn:#8a5a00;--wnb:#fff1d6;--er:#b3261e;--erb:#fdeceb;--ub:#1d3a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0a121e;--cd:#111c2c;--tx:#e7ecf4;--mu:#9fabc0;--ln:#223048;--sb:#0d1727;--pr:#d4a65a;--prt:#1a1405;--br:#dbb06a;--brs:#2a2111;--ok:#4ade80;--okb:#10301d;--wn:#fbbf24;--wnb:#3a2c0b;--er:#f87171;--erb:#3b1517}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.8 "Segoe UI",Tahoma,system-ui,sans-serif}
button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--bra);outline-offset:2px}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.sb{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100dvh;background:var(--sb);color:var(--sbt);display:flex;flex-direction:column;gap:24px;padding:22px 14px;z-index:6}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.mk{width:42px;height:42px;border-radius:12px;background:rgba(200,150,62,.16);display:grid;place-items:center;color:#e3b25f;flex:none}
.mk svg{width:26px;height:26px}
.brand b{display:block;font-size:17px;line-height:1.35}.brand small{color:var(--sbm);font-size:12px}
.sb nav{display:flex;flex-direction:column;gap:4px}
.sb nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--sbm);text-decoration:none;font-size:15px;position:relative}
.sb nav a:hover{background:rgba(255,255,255,.06);color:var(--sbt)}
.sb nav a[aria-current=page]{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.sb nav a[aria-current=page]::before{content:"";position:absolute;inset-inline-start:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:#e3b25f}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sbf{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sst{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 12px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#4ade80;flex:none}[data-ok=false] .dot{background:#f87171}
.th{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.16);background:none;color:var(--sbt);border-radius:10px;padding:7px 12px;font-size:13px}
.mn{max-width:920px;width:100%;box-sizing:border-box;margin:0 auto;padding:30px 28px 12px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--ln)}
.ph h1{margin:0;font-size:26px;line-height:1.4}.ph p{margin:0;color:var(--mu);font-size:14.5px}
.acts{display:flex;gap:8px}
.btn{border:1px solid var(--ln);background:var(--cd);border-radius:10px;padding:5px 14px;font-size:14px}
.btn:hover{border-color:var(--bra)}.btn.dg{color:var(--er)}
.empty{padding:6px 0 8px}
.empty h2{font-size:19px;margin:0 0 4px}.empty>p{margin:0 0 16px;color:var(--mu);font-size:14.5px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.sc{text-align:start;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-inline-start:4px solid var(--bra)}
.sc:hover{border-color:var(--bra);box-shadow:0 4px 14px -8px rgba(16,33,63,.4)}
.sc small{color:var(--br);font-weight:700;font-size:12.5px}.sc span{font-size:15px}
#log{display:flex;flex-direction:column;gap:18px}
.m{overflow-wrap:anywhere}
.m.u{align-self:flex-start;max-width:85%;background:var(--ub);color:#fff;padding:10px 18px;border-radius:16px 16px 4px 16px}
.m.a{background:var(--cd);border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px -6px rgba(16,33,63,.35)}
.ah{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--ln);font-size:14px}
.ah .mk{width:30px;height:30px;border-radius:9px;background:var(--brs);color:var(--br)}.ah .mk svg{width:18px;height:18px}
.ah time{margin-inline-start:auto;color:var(--mu);font-size:12.5px}
.ab{padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px}
.vf{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-radius:10px;padding:10px 14px}
.vf.ok{background:var(--okb);color:var(--ok)}.vf.wn{background:var(--wnb);color:var(--wn)}
.vf b{font-size:14.5px}.vf small{display:block;font-size:12.5px;opacity:.9}.pc{font-size:20px;font-weight:700;grid-row:span 1}
.vf .mt{grid-column:1/-1;height:5px;border-radius:5px;background:rgba(127,127,127,.22);margin-top:6px;overflow:hidden}.mt i{display:block;height:100%;background:currentColor;border-radius:5px}
.tx{white-space:pre-wrap;font-size:17px;line-height:2}
.tx.live::after{content:"▍";color:var(--bra);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.rf h4{margin:0 0 8px;font-size:13.5px;color:var(--mu)}
.refs{display:flex;flex-wrap:wrap;gap:8px}
.ref{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--cd);border-radius:10px;padding:3px 4px 3px 12px;font-size:14px}
.ref b{background:var(--brs);color:var(--br);border-radius:7px;padding:0 10px;min-width:38px;text-align:center}
.ref:hover{border-color:var(--bra)}.ref.x{color:var(--mu)}.ref.x b{background:var(--ln);color:var(--mu)}
.ban{border-radius:10px;padding:8px 14px;font-size:13.5px;background:var(--wnb);color:var(--wn)}.ban.in{background:var(--brs);color:var(--br)}
.err{background:var(--erb);color:var(--er);border-radius:12px;padding:16px;text-align:center}
.err b{display:block;font-size:16px}.err p{margin:2px 0 10px;color:var(--tx);font-size:14.5px}
.rt{background:var(--er);color:#fff;border:0;border-radius:9px;padding:5px 20px}
.mu{color:var(--mu);font-size:13.5px;margin:0}
.dots{display:flex;gap:6px;padding:8px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--bra);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.comp{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:20px;background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;box-shadow:0 -10px 24px -14px rgba(16,33,63,.45)}
.comp:focus-within{border-color:var(--bra)}
textarea{width:100%;box-sizing:border-box;border:0;background:none;resize:none;min-height:56px;max-height:200px;font-size:16px;line-height:1.7}textarea:focus{outline:none}
.cb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--ln)}
.seg{display:flex;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:2px 12px;border-radius:8px;font-size:13px;color:var(--mu)}
.seg [aria-pressed=true]{background:var(--cd);color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#cnt{margin-inline-start:auto;color:var(--mu);font-size:13px}#cnt.over{color:var(--er);font-weight:700}
.pri,.dng{display:flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:6px 20px;font-weight:700;background:var(--pr);color:var(--prt)}
.dng{background:var(--er);color:#fff}.pri:disabled{opacity:.4;cursor:not-allowed}
.wr{margin:8px 0 0;color:var(--er);font-size:13.5px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:16px 18px}
.cd h3{margin:0 0 10px;font-size:16px}.cd p{margin:0}
.li{display:flex;flex-direction:column;gap:10px}
.it{width:100%;text-align:start;display:flex;align-items:center;gap:14px;cursor:pointer}
.it:hover{border-color:var(--bra)}.it div{flex:1;min-width:0}.it b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no{background:var(--brs);color:var(--br);border-radius:10px;min-width:48px;height:48px;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.empt{text-align:center;color:var(--mu);padding:32px 12px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:14px 16px 28px}
#ov{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:8}
#dr{position:fixed;inset-block:0;inset-inline-start:0;width:min(430px,100%);box-sizing:border-box;background:var(--cd);z-index:9;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));box-shadow:0 0 36px rgba(0,0,0,.4);animation:sl .2s ease-out;overflow-y:auto}
@keyframes sl{from{transform:translateX(100%)}}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:16px}.dh h2{margin:0;font-size:21px;flex:1}
.ib{border:1px solid var(--ln);background:none;border-radius:9px;width:36px;height:36px}
.tg{font-size:12.5px;padding:2px 12px;border-radius:999px;background:var(--okb);color:var(--ok);font-weight:700}.tg.x{background:var(--ln);color:var(--mu)}
#dx{white-space:pre-wrap;font-size:18px;line-height:2.1;border-inline-start:4px solid var(--bra);padding-inline-start:14px;margin:18px 0}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.tile small{display:block;color:var(--mu);font-size:13px}.tile b{display:block;font-size:28px;line-height:1.4}.tile span{font-size:12.5px;color:var(--mu)}
.tile.ok b{color:var(--ok)}.tile.wn2 b{color:var(--wn)}
.dg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.br2{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:10px;font-size:14px}
.br2 .tr{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}.br2 .tr i{display:block;height:100%;border-radius:5px;background:var(--bra)}
.br2 em{font-style:normal;color:var(--mu);text-align:end;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:6px}.kv dt{color:var(--mu)}.kv dd{margin:0;overflow-wrap:anywhere}
.spark{width:100%;height:64px;display:block;margin-top:6px}.spark rect{fill:var(--bra)}.spark rect:hover{fill:var(--pr)}
.rs{display:flex;gap:8px;margin-bottom:14px}.rs input{flex:1;border:1px solid var(--ln);background:var(--cd);border-radius:10px;padding:6px 12px;font-size:15px}
.fbk{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px}.fbk button{border:1px solid var(--ln);background:var(--cd);border-radius:9px;padding:2px 12px;font-size:15px}.fbk button:hover{border-color:var(--bra)}
.dz{display:block;border:2px dashed var(--ln);border-radius:14px;padding:22px 16px;text-align:center;cursor:pointer;color:var(--mu)}
.dz:hover,.dz.on{border-color:var(--bra);color:var(--tx)}.dz input{display:none}
.fl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln);font-size:14.5px}.fl:first-of-type{border-top:0}
.fl div{flex:1;min-width:0}.fl b{display:block;overflow-wrap:anywhere}.fl span{color:var(--mu);font-size:13px}
.bd{font-size:12px;padding:1px 10px;border-radius:999px;background:var(--brs);color:var(--br);font-weight:700}
.nt{border-radius:10px;padding:10px 14px;font-size:13.5px;background:var(--brs);color:var(--br);margin-bottom:12px}.nt.w{background:var(--wnb);color:var(--wn)}.nt.e{background:var(--erb);color:var(--er)}
.cs summary{cursor:pointer;font-size:13.5px;color:var(--mu)}.cs blockquote{margin:8px 0 0;padding:6px 12px;border-inline-start:3px solid var(--bra);background:var(--bg);border-radius:6px;font-size:14px}.cs blockquote small{display:block;color:var(--mu)}
.cp{width:auto;height:auto;padding:1px 10px;font-size:12.5px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 .sb{height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px}
 .brand small,.th span,.sst span.t{display:none}.sbf{margin:0 0 0 0;margin-inline-start:auto;flex-direction:row;align-items:center}
 .sb nav{position:fixed;inset-inline:0;bottom:0;flex-direction:row;justify-content:space-around;background:var(--sb);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.1);z-index:7;gap:0}
 .sb nav a{flex-direction:column;gap:0;font-size:11.5px;padding:4px 14px}.sb nav a[aria-current=page]::before{display:none}
 .mn{padding:18px 16px 84px}.ph h1{font-size:22px}.comp{bottom:calc(62px + env(safe-area-inset-bottom,0px))}.m.u{max-width:94%}
}
:root{--bg:#eef1f6;--cd:#ffffff;--tx:#0b1220;--mu:#3a475c;--ln:#cfd7e3;--sb:#0f1f3d;--sbt:#ffffff;--sbm:#c3d0e8;--pr:#14284b;--prt:#fff;--br:#6e4708;--brs:#f6ead2;--bra:#b8862f;--ok:#0b6b43;--okb:#dcf2e6;--wn:#7a4d00;--wnb:#fff0cc;--er:#a8201a;--erb:#fde6e4;--ub:#14284b;--sh:0 10px 30px -14px rgba(15,31,61,.35);--ff-h:"Amiri","Traditional Arabic","Sakkal Majalla","Noto Naskh Arabic",Georgia,serif}
:root[data-theme=dark]{--bg:#070d18;--cd:#0f1a2d;--tx:#ffffff;--mu:#d3dcec;--ln:#2b3b58;--sb:#050a14;--sbt:#ffffff;--sbm:#c3d0e8;--pr:#e2b665;--prt:#140f02;--br:#f0c677;--brs:#2d2310;--bra:#e2b665;--ok:#6ee79b;--okb:#0f3321;--wn:#ffd166;--wnb:#3d2d08;--er:#ff8a84;--erb:#431a1c;--ub:#1d3a6b;--sh:0 12px 34px -14px rgba(0,0,0,.8);color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-weight:600;letter-spacing:.1px;background:var(--bg);color:var(--tx);transition:background .25s,color .25s}
:root[data-theme=dark] body{background:radial-gradient(1200px 520px at 80% -10%,#13244a 0%,transparent 60%),var(--bg)}
:root:not([data-theme=dark]) body{background:radial-gradient(1200px 520px at 80% -10%,#fbf3e1 0%,transparent 55%),var(--bg)}
h1,h2,h3,h4,b,strong,.pc,.no{font-weight:800}
.ph h1,.empty h2,.dh h2{font-family:var(--ff-h);font-size:32px;font-weight:700;letter-spacing:0;background:linear-gradient(90deg,var(--tx),var(--br));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.empty h2{font-size:26px}.dh h2{font-size:26px}
.ph{border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--bra),transparent) 1}
.brand b{font-family:var(--ff-h);font-size:21px;font-weight:700;color:#fff}
.mk{background:linear-gradient(145deg,rgba(226,182,101,.35),rgba(226,182,101,.08));box-shadow:inset 0 0 0 1px rgba(226,182,101,.45)}
.sb{background:linear-gradient(180deg,var(--sb),#0a1630);box-shadow:var(--sh)}
:root[data-theme=dark] .sb{background:linear-gradient(180deg,#060c18,#0a1426);border-inline-end:1px solid var(--ln)}
.sb nav a{font-weight:700;color:var(--sbm)}.sb nav a:hover,.sb nav a[aria-current=page]{color:#fff}
.sb nav a[aria-current=page]{background:linear-gradient(90deg,rgba(226,182,101,.22),rgba(255,255,255,.05))}
.cd,.tile,.m.a,.sc,.comp,.btn,.ref,#dr{box-shadow:var(--sh)}
.m.a,.cd,.tile,.sc,.comp{border-radius:18px}
.m.a{border-top:3px solid var(--bra)}
.m.u{background:linear-gradient(135deg,#1d3a6b,#14284b);color:#fff;font-weight:700;box-shadow:var(--sh)}
.tx,#dx{font-weight:600;color:var(--tx)}
.tx{font-size:18px;line-height:2.05}
.ah{background:linear-gradient(90deg,var(--brs),transparent)}
.mu,.ph p,.empty>p,.rf h4,.ah time,.fbk,footer,.empt,.kv dt,.tile small,.tile span,.cs summary,#cnt,.br2 em,.fl span{color:var(--mu);font-weight:600}
.sc small,.ref b,.no,.bd{color:var(--br);font-weight:800}
.pri{background:linear-gradient(135deg,var(--pr),#2a4a82);color:var(--prt);box-shadow:0 8px 18px -10px rgba(20,40,75,.9)}
:root[data-theme=dark] .pri{background:linear-gradient(135deg,#f0c677,#c8963e);color:#140f02}
.pri:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.btn,.ref,.sc,.it{transition:border-color .2s,transform .2s,box-shadow .2s}
.sc:hover,.it:hover{transform:translateY(-2px)}
textarea::placeholder,.rs input::placeholder{color:var(--mu);opacity:.85}
textarea,.rs input,select{color:var(--tx);font-weight:600}
.seg{background:var(--bg)}.seg button{color:var(--mu);font-weight:700}.seg [aria-pressed=true]{color:var(--tx)}
footer{padding-bottom:36px}
.sb{box-sizing:border-box;overflow-y:auto}
@media(max-width:820px){.sb{overflow:visible}}
.thm{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:3px;gap:3px}
.thm button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:#e4ebf8;border-radius:9px;padding:6px 8px;font-size:13px;font-weight:800;white-space:nowrap}
.thm button .i{width:16px;height:16px}
.thm button:hover{background:rgba(255,255,255,.1)}
.thm button[aria-pressed=true]{background:linear-gradient(135deg,#f0c677,#c8963e);color:#140f02;box-shadow:0 2px 8px -2px rgba(0,0,0,.5)}
@media(max-width:820px){.thm button{padding:6px 8px;font-size:12px}.thm button .i{display:none}.brand b{font-size:15px}}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--ln)}.tabs button{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;margin-bottom:-1px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mu);font:inherit;font-weight:700;cursor:pointer}.tabs button[aria-selected=true]{color:var(--tx);border-bottom-color:#c49a52}
:root[data-theme=light] #lg{color:#000;font-weight:800}@media(prefers-color-scheme:light){:root:not([data-theme=dark]) #lg{color:#000;font-weight:800}}
</style></head><body>

   yield{ev,data:dt.join('\n')}}}}

  if(!res.ok){m.err=res.status;if(res.status==404&&caseOn()){CASE=null;USE=false;sv(CK,null);sv(UK,USE);updCase()}const d=(await res.json().catch(()=>({}))).detail;m.detail=typeof d=='string'?d:''}

function dash(j){const L=j.latency_ms||{},S=j.system||{},Cp=j.corpus||{},bar=(a,v)=>`<div class="br2"><span>${a}</span><div class="tr" role="img" aria-label="${a} ${pc(v)}"><i style="width:${Math.min(100,Math.round(v*100))}%"></i></div><em>${pc(v)}</em></div>`;
