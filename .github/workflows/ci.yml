name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # CPU-only torch first: the default Linux wheel pulls ~2 GB of CUDA libraries the runner cannot use.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Type check (mypy)
        run: mypy src

      - name: Tests (coverage gate 70%)
        env:
          HF_HUB_OFFLINE: "1"        # tests use stub embedders; never download models in CI
          TRANSFORMERS_OFFLINE: "1"
        run: pytest --cov=src --cov-report=xml --cov-fail-under=70

      - name: Build package (wheel + sdist)
        run: pip install build && python -m build

      - name: Retrieval quality gate (offline BM25 on the golden set, no keys)
        run: python scripts/evaluation/eval_retrieval_offline.py --min-hit5 0.80 --output retrieval_gate.json

      - name: Validate monitoring configs and dashboard
        run: python scripts/ops/check_monitoring_configs.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            coverage.xml
            retrieval_gate.json
          if-no-files-found: ignore
