[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "civil-code-rag"
version = "0.1.0"
description = "RAG pipeline for the Egyptian Civil Code (Arabic legal Q&A with citations)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ali Ahmed Zaki" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.24.0",
    "pyarabic>=0.6.15",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "openai>=1.40.0",
    "ragas>=0.1.16",
    "datasets>=2.20.0",
    "mlflow>=2.16.0",
    "dvc[gdrive]>=3.55.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Opt-in only:
tracing = ["langfuse>=2.44.0,<3"]
loadtest = [
    "locust>=2.29.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-requests",
    "promql-parser>=0.4.0",  # validates dashboard / alert PromQL in CI
]

[project.scripts]
civil-code-rag = "api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/rag", "src/agents", "src/tools", "src/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"src/rag/ingestion/legal_arabic_text.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
